name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, Clippy, coverage (the Linux test run) and a build and test on
  # macOS and Windows, shared by every 198x Rust repo
  # (stevehill1981/198x-workflows). Project jobs follow.
  rust:
    name: Rust
    uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@v1
    with:
      coverage-floor: 75
      # Windows test failures surfaced by the shared CI are tracked in cat198x/cat198x#102;
      # until they're fixed, macOS and Windows run `cargo check` only, as before.
      platform-test: false
      coverage-args: --lib --tests

  # The Tauri UI is a standalone crate, deliberately excluded from the
  # workspace (it keeps its heavyweight webview dependency tree out of the lean
  # CLI crate). The jobs above use `--workspace`, so they never touch it; this
  # job builds, lints, and tests it on its own. It runs on Linux with the Tauri
  # system dependencies installed — macOS/Windows ship the webview, but the
  # Linux runner is the cheaper smoke build and proves the cross-platform deps
  # resolve.
  ui:
    name: UI (Tauri)
    runs-on: ubuntu-latest
    # Cap the job: a hung step (the apt install below has stalled on a runner
    # mirror more than once) should fail in minutes, not sit for the 6-hour
    # default holding up the merge.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        # A slow Azure mirror exhausted all three bounded retries in #104.
        # Reuse Emu198x's installer, which prefers another mirror on each retry.
        run: |
          bash scripts/ci/apt-install.sh \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
          shared-key: ui

      - name: Check formatting
        working-directory: ui
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: ui
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: ui
        run: cargo test
