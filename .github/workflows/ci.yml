name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Format, Clippy, coverage (the Linux test run) and a build and test on
  # macOS and Windows, shared by every 198x Rust repo
  # (stevehill1981/198x-workflows). Project jobs follow.
  rust:
    name: Rust
    uses: stevehill1981/198x-workflows/.github/workflows/rust-ci.yml@feat/rust-ci-inputs
    with:
      coverage-floor: 75
      coverage-args: --lib --tests

  # The Tauri UI is a standalone crate, deliberately excluded from the
  # workspace (it keeps its heavyweight webview dependency tree out of the lean
  # CLI crate). The jobs above use `--workspace`, so they never touch it; this
  # job builds, lints, and tests it on its own. It runs on Linux with the Tauri
  # system dependencies installed — macOS/Windows ship the webview, but the
  # Linux runner is the cheaper smoke build and proves the cross-platform deps
  # resolve.
  ui:
    name: UI (Tauri)
    runs-on: ubuntu-latest
    # Cap the job: a hung step (the apt install below has stalled on a runner
    # mirror more than once) should fail in minutes, not sit for the 6-hour
    # default holding up the merge.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        # The webkit apt install periodically stalls on a slow/unreachable
        # GitHub runner mirror. Retry up to three times, each attempt bounded by
        # `timeout` so a stall fails fast and the next attempt gets a fresh shot
        # (often a different mirror) rather than hanging the whole job.
        run: |
          set -e
          for attempt in 1 2 3; do
            if timeout 300 bash -c '
              sudo apt-get update -o Acquire::Retries=3
              sudo apt-get install -y -o Acquire::Retries=3 \
                libwebkit2gtk-4.1-dev \
                libgtk-3-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev
            '; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 15
          done
          echo "::error::apt install failed after 3 attempts"
          exit 1

      - name: Read pinned toolchain
        id: toolchain
        run: |
          channel=$(awk -F'"' '/^channel/{print $2}' rust-toolchain.toml)
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui
          shared-key: ui

      - name: Check formatting
        working-directory: ui
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: ui
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: ui
        run: cargo test
