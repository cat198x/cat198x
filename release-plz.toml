# release-plz configuration.
#
# Trigger: every push to main runs release-plz, which opens (or updates) a
# "chore: release" PR with a bumped version and a CHANGELOG entry generated
# from the new commits (conventional-commit prefixes drive the bump). Merging
# that PR creates a git tag, which fires .github/workflows/release.yml
# (cargo-dist) to build the `cat198x` CLI and attach the archives to a GitHub
# Release.
#
# publish = true: cat198x goes to crates.io, so `cargo install cat198x` works
# alongside the Homebrew tap and the cargo-dist installers. release-plz runs the
# publish itself and authenticates over crates.io Trusted Publishing — the
# workflow grants `id-token: write` and no registry token is stored anywhere.
# The family default is publish = false; see the recorded exception in
# 198x/decisions/project-skeleton-standard.md, and the rules that publishing
# brings with it in 198x/decisions/releasing-published-crates.md.
#
# git_release_enable = false: cargo-dist owns the GitHub Release, not
# release-plz — release-plz bumps, changelogs, tags, and publishes.
[workspace]
publish = true
git_release_enable = false
git_tag_enable = true
changelog_update = true

# git_only is deliberately absent, and must stay that way while publish = true:
# release-plz rejects the pair outright ("Config options 'git_only' and 'publish'
# are mutually exclusive"). It existed to give a never-published crate a version
# baseline from its git tag; with the crate on crates.io the registry is that
# baseline. Re-adding it is the reflex to resist if release-plz ever stops
# opening release PRs — check the registry first.

# What reaches the CHANGELOG. Without this every commit lands under a single
# "### Other" heading in commit-subject order, so the one change a reader is
# deciding an upgrade on sits level with doc and CI housekeeping.
#
# Parsers are evaluated in order. The scope rule comes first because `^feat`
# matches `feat(ci):` perfectly well, and the machinery that ships a release is
# not a change *in* the release.
#
# Skipped types still move the version and still exist in git; they are absent
# from the changelog, not from the release. A release made entirely of skipped
# commits therefore renders a version header with no sections — which is the
# prompt to write the entry by hand, as releasing-published-crates.md requires
# before merging any release PR.
[changelog]
protect_breaking_commits = true
commit_parsers = [
  { message = '^chore(\([^)]*\))?: release\b', skip = true },
  { message = '^(feat|fix|perf|revert)\((ci|release)\)', skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^revert", group = "Reverted" },
  # Before the skip below, which would otherwise claim these: `^chore` matches
  # `chore(deps):` perfectly well. Dependency bumps change Cargo.lock, which is
  # packaged, so they cut a release — and a release that moves the version must
  # say something, or the changelog falls behind the version again.
  { message = '^(chore|build)\(deps\)', group = "Dependencies" },
  { message = "^(docs|test|chore|ci|build|refactor|style)", skip = true },
  { message = "^Merge", skip = true },
  # Last, and a catch-all rather than nothing: a commit matching no parser is
  # dropped, not filed. `pr-title.yml` should stop an unprefixed subject ever
  # reaching main, so anything landing here escaped that gate — which is exactly
  # when it needs to be visible rather than silently absent.
  { message = ".*", group = "Other" },
]
